# Render Blueprint — Multi-Livestock Marketplace API only.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: livestock-marketplace-api
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: NPM_CONFIG_PRODUCTION=false npm ci && npm run build:backend
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HUSKY
        value: '0'
      - key: NPM_CONFIG_PRODUCTION
        value: 'false'
      - key: PORT
        value: '5000'
      - key: API_PREFIX
        value: /api/v1
      - key: DEFAULT_CURRENCY
        value: INR
      - key: CLOUDINARY_FOLDER
        value: livestock-marketplace
      - key: SEED_ON_BOOT
        value: 'false'
      - key: COOKIE_SECURE
        value: 'true'
      - key: COOKIE_SAME_SITE
        value: none
      # Set these in the Render dashboard (do not commit secrets):
      - key: MONGODB_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      # Optional Cloudinary (mock uploads if unset):
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
